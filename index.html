<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Analógico y Clima en Vivo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="Sello ciencias de la salud.png">
    <link rel="icon" type="image/png" href="Sello ciencias de la salud.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Transiciones suaves para las manecillas del reloj */
        .hand {
            transform-origin: bottom center;
            transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }
        .hand-smooth {
            transform-origin: bottom center;
        }
        /* Efectos de brillo de fondo */
        .glow-bg {
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full font-sans flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Fondo de gradiente suave -->
    <div class="fixed inset-0 glow-bg pointer-events-none"></div>

    <!-- Contenido Principal -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-4xl mx-auto flex flex-col items-center gap-8">
            
            <!-- Encabezado / Fecha -->
            <header class="text-center space-y-2">
                <div id="date-weekday" class="text-blue-400 font-semibold tracking-wider text-sm sm:text-base uppercase">
                    Cargando fecha...
                </div>
                <h1 id="date-full" class="text-2xl sm:text-4xl md:text-5xl font-bold tracking-tight text-slate-50">
                    -- de -------- de ----
                </h1>
            </header>

            <!-- Sección Central: Reloj + Clima -->
            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center justify-items-center">
                
                <!-- Reloj Analógico -->
                <div class="relative flex flex-col items-center justify-center p-6 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl w-full max-w-xs sm:max-w-sm">
                    
                    <!-- Reloj Canvas / SVG -->
                    <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
                        <svg class="w-full h-full" viewBox="0 0 200 200">
                            <!-- Esfera exterior -->
                            <circle cx="100" cy="100" r="95" fill="none" stroke="#1e293b" stroke-width="4" />
                            <circle cx="100" cy="100" r="90" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
                            
                            <!-- Marcas de minutos y horas -->
                            <g id="clock-marks">
                                <!-- Generadas dinámicamente con JS -->
                            </g>

                            <!-- Números del 1 al 12 -->
                            <g id="clock-numbers">
                                <!-- Generados dinámicamente con JS -->
                            </g>

                            <!-- Manecilla de Horas -->
                            <line id="hour-hand" x1="100" y1="100" x2="100" y2="60" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
                            
                            <!-- Manecilla de Minutos -->
                            <line id="minute-hand" x1="100" y1="100" x2="100" y2="40" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
                            
                            <!-- Centro del reloj -->
                            <circle cx="100" cy="100" r="5" fill="#3b82f6" />
                            <circle cx="100" cy="100" r="2" fill="#ffffff" />
                        </svg>
                    </div>

                    <!-- Hora digital de respaldo -->
                    <div id="digital-time" class="mt-4 font-mono text-xl sm:text-2xl font-semibold tracking-wider text-slate-300">
                        00:00
                    </div>
                </div>

                <!-- Módulo Meteorológico (Fijo Jerez de la Frontera) -->
                <div class="w-full max-w-xs sm:max-w-sm flex flex-col justify-between p-6 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl space-y-6">
                    
                    <!-- Ubicación Fija -->
                    <div class="space-y-1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 text-slate-200 font-semibold text-base sm:text-lg">
                                <i data-lucide="map-pin" class="w-5 h-5 text-blue-400"></i>
                                <span>Jerez de la Frontera</span>
                            </div>
                            <span id="weather-updated" class="text-xs text-slate-500">Actualizando...</span>
                        </div>
                        <p class="text-xs text-slate-400 pl-7">Cádiz, España</p>
                    </div>

                    <!-- Estado Climático Principal -->
                    <div class="flex items-center justify-between my-2">
                        <div class="flex flex-col">
                            <span id="weather-temp" class="text-5xl font-bold tracking-tight text-white">--°C</span>
                            <span id="weather-condition" class="text-sm font-medium text-slate-400 mt-1">Cargando...</span>
                        </div>
                        <div id="weather-icon-container" class="p-3 bg-slate-800/50 rounded-2xl border border-slate-700/40 text-blue-400">
                            <i data-lucide="cloud-sun" class="w-12 h-12"></i>
                        </div>
                    </div>

                    <!-- Métricas Secundarias -->
                    <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800/80">
                        <div class="flex items-center gap-2.5 bg-slate-800/30 p-2.5 rounded-xl border border-slate-800/50">
                            <i data-lucide="thermometer" class="w-4 h-4 text-amber-400"></i>
                            <div>
                                <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium">Sensación</p>
                                <p id="weather-feels" class="text-sm font-semibold text-slate-200">--°C</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2.5 bg-slate-800/30 p-2.5 rounded-xl border border-slate-800/50">
                            <i data-lucide="droplets" class="w-4 h-4 text-cyan-400"></i>
                            <div>
                                <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium">Humedad</p>
                                <p id="weather-humidity" class="text-sm font-semibold text-slate-200">--%</p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- Pie de página -->
    <footer class="relative z-10 py-4 text-center text-xs text-slate-600">
        Reloj y Clima en Vivo &bull; Datos de tiempo real proporcionados por Open-Meteo
    </footer>

    <!-- Lógica en JavaScript -->
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Coordenadas fijas para Jerez de la Frontera
        const JEREZ_LAT = 36.6866;
        const JEREZ_LON = -6.0701;

        // ----------------------------------------------------
        // 1. RELOJ ANALÓGICO Y FECHA
        // ----------------------------------------------------
        
        // Renderizar marcas y números del reloj en el SVG
        function renderClockFace() {
            const marksGroup = document.getElementById('clock-marks');
            const numbersGroup = document.getElementById('clock-numbers');
            let marksHTML = '';
            let numbersHTML = '';

            // Renderizar marcas de minutos y horas
            for (let i = 0; i < 60; i++) {
                const angle = i * 6; // 360 / 60
                const isHourMark = i % 5 === 0;
                const r1 = 88;
                const r2 = isHourMark ? 80 : 84;
                const strokeWidth = isHourMark ? 2 : 1;
                const color = isHourMark ? '#94a3b8' : '#334155';

                // Cálculo trigonométrico ajustado (-90° para sincronizar con las 12h en la cima)
                const rad = ((angle - 90) * Math.PI) / 180;
                const x1 = 100 + r1 * Math.cos(rad);
                const y1 = 100 + r1 * Math.sin(rad);
                const x2 = 100 + r2 * Math.cos(rad);
                const y2 = 100 + r2 * Math.sin(rad);

                marksHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;
            }

            // Renderizar números del 1 al 12
            const rNumber = 68; // Radio para situar números dentro de la esfera
            for (let num = 1; num <= 12; num++) {
                const angle = num * 30; // 360 / 12 = 30°
                const rad = ((angle - 90) * Math.PI) / 180;
                const x = 100 + rNumber * Math.cos(rad);
                const y = 100 + rNumber * Math.sin(rad);

                numbersHTML += `<text x="${x}" y="${y}" fill="#e2e8f0" font-size="13" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle" dominant-baseline="central">${num}</text>`;
            }

            marksGroup.innerHTML = marksHTML;
            numbersGroup.innerHTML = numbersHTML;
        }

        renderClockFace();

        // Actualizar el reloj exactamente con el mismo objeto Date()
        function updateClock() {
            const now = new Date();

            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Rotaciones por saltos discretos (paso a paso)
            const minuteDeg = minutes * 6;              // 360 / 60 = 6° por minuto

            // Cálculo discreto para la aguja de las horas en tramos de 15 minutos:
            let hourQuarterBonus = 0;
            if (minutes >= 45) {
                hourQuarterBonus = 22.5;
            } else if (minutes >= 30) {
                hourQuarterBonus = 15;
            } else if (minutes >= 15) {
                hourQuarterBonus = 7.5;
            }

            const hourDeg = ((hours % 12) * 30) + hourQuarterBonus;

            // Elementos SVG
            const minuteHand = document.getElementById('minute-hand');
            const hourHand = document.getElementById('hour-hand');

            // Rotación fija respecto al centro del lienzo SVG (100, 100)
            minuteHand.setAttribute('transform', `rotate(${minuteDeg}, 100, 100)`);
            hourHand.setAttribute('transform', `rotate(${hourDeg}, 100, 100)`);

            // Sincronización exacta de la hora digital
            const pad = (n) => n.toString().padStart(2, '0');
            document.getElementById('digital-time').textContent = `${pad(hours)}:${pad(minutes)}`;

            // Actualizar fecha
            updateDate(now);
        }

        function updateDate(now) {
            const daysOfWeek = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const months = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            const weekday = daysOfWeek[now.getDay()];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();

            document.getElementById('date-weekday').textContent = weekday;
            document.getElementById('date-full').textContent = `${day} de ${month} de ${year}`;
        }

        // Ejecutar actualización fluida mediante requestAnimationFrame para sincronía perfecta
        function tick() {
            updateClock();
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        // ----------------------------------------------------
        // 2. CLIMA EXCLUSIVO DE JEREZ DE LA FRONTERA
        // ----------------------------------------------------

        const wmoCodeMap = {
            0: { desc: 'Cielo Despejado', icon: 'sun' },
            1: { desc: 'Principalmente Despejado', icon: 'sun-medium' },
            2: { desc: 'Parcialmente Nublado', icon: 'cloud-sun' },
            3: { desc: 'Nublado', icon: 'cloud' },
            45: { desc: 'Niebla', icon: 'cloud-fog' },
            48: { desc: 'Niebla Helada', icon: 'cloud-fog' },
            51: { desc: 'Llovizna Ligera', icon: 'cloud-drizzle' },
            53: { desc: 'Llovizna Moderada', icon: 'cloud-drizzle' },
            55: { desc: 'Llovizna Densa', icon: 'cloud-rain' },
            61: { desc: 'Lluvia Ligera', icon: 'cloud-rain' },
            63: { desc: 'Lluvia Moderada', icon: 'cloud-rain' },
            65: { desc: 'Lluvia Intensa', icon: 'cloud-lightning' },
            71: { desc: 'Nieve Ligera', icon: 'snowflake' },
            73: { desc: 'Nieve Moderada', icon: 'snowflake' },
            75: { desc: 'Nieve Intensa', icon: 'snowflake' },
            80: { desc: 'Chubascos Leves', icon: 'cloud-rain-wind' },
            81: { desc: 'Chubascos Moderados', icon: 'cloud-rain-wind' },
            82: { desc: 'Chubascos Violentos', icon: 'cloud-lightning' },
            95: { desc: 'Tormenta Eléctrica', icon: 'cloud-lightning' },
            96: { desc: 'Tormenta con Granizo', icon: 'cloud-hail' }
        };

        async function fetchJerezWeather() {
            try {
                document.getElementById('weather-updated').textContent = 'Cargando...';

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${JEREZ_LAT}&longitude=${JEREZ_LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&timezone=auto`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error('Error en la API');

                const data = await response.json();
                const current = data.current;

                // Actualizar métricas
                document.getElementById('weather-temp').textContent = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('weather-feels').textContent = `${Math.round(current.apparent_temperature)}°C`;
                document.getElementById('weather-humidity').textContent = `${current.relative_humidity_2m}%`;

                // Código WMO
                const codeInfo = wmoCodeMap[current.weather_code] || { desc: 'Desconocido', icon: 'cloud-sun' };
                document.getElementById('weather-condition').textContent = codeInfo.desc;

                // Actualizar Icono
                const iconContainer = document.getElementById('weather-icon-container');
                iconContainer.innerHTML = `<i data-lucide="${codeInfo.icon}" class="w-12 h-12"></i>`;
                lucide.createIcons();

                const now = new Date();
                const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                document.getElementById('weather-updated').textContent = `Act. ${timeString}`;

            } catch (error) {
                console.error('Error al obtener datos meteorológicos:', error);
                document.getElementById('weather-updated').textContent = 'Error al actualizar';
            }
        }

        // Obtener clima de Jerez al cargar y refrescar cada 10 minutos
        fetchJerezWeather();
        setInterval(fetchJerezWeather, 10 * 60 * 1000);
    </script>
</body>
</html>
